<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
    <title>Jonathan's Piano Web App</title>
  </head>
  <body>
    <!-- Piano Container -->
    <div class="piano">
      <!-- Demonstrating Piano Notes -->
      <div data-note="C" class="key white"></div>
      <div data-note="Db" class="key black"></div>
      <div data-note="D" class="key white"></div>
      <div data-note="Eb" class="key black"></div>
      <div data-note="E" class="key white"></div>
      <div data-note="F" class="key white"></div>
      <div data-note="Gb" class="key black"></div>
      <div data-note="G" class="key white"></div>
      <div data-note="Ab" class="key black"></div>
      <div data-note="A" class="key white"></div>
      <div data-note="Bb" class="key black"></div>
      <div data-note="B" class="key white"></div>
    </div>

    <!-- Load Audio Files -->
    <audio id="C" src="Build-A-Piano/C.mp3"></audio>
    <audio id="Db" src="Build-A-Piano/Db.mp3"></audio>
    <audio id="D" src="Build-A-Piano/D.mp3"></audio>
    <audio id="Eb" src="Build-A-Piano/Eb.mp3"></audio>
    <audio id="E" src="Build-A-Piano/E.mp3"></audio>
    <audio id="F" src="Build-A-Piano/F.mp3"></audio>
    <audio id="Gb" src="Build-A-Piano/Gb.mp3"></audio>
    <audio id="G" src="Build-A-Piano/G.mp3"></audio>
    <audio id="Ab" src="Build-A-Piano/Ab.mp3"></audio>
    <audio id="A" src="Build-A-Piano/A.mp3"></audio>
    <audio id="Bb" src="Build-A-Piano/Bb.mp3"></audio>
    <audio id="B" src="Build-A-Piano/B.mp3"></audio>
  </body>
  <footer><footer>
</html>
